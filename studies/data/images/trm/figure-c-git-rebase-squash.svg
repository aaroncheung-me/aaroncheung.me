<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fc1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#27803e"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="30" y="34" fill="#111" font-size="16" font-weight="bold">Figure C: Rebase &amp; Squash, the Sequence I Actually Learned</text>
  <line x1="30" y1="46" x2="970" y2="46" stroke="#ccc" stroke-width="1"/>
  <text x="30" y="66" fill="#666" font-size="10.5" font-style="italic">redrawn from memory after learning it through trial, error, and a lot of Marvin's patience</text>

  <g font-size="10.5">
    <rect x="70" y="96" width="360" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="1.3"/>
    <text x="90" y="121" fill="#111">1. work on feature branch, commit as I go</text>

    <path d="M250,136 L250,160" stroke="#27803e" stroke-width="1.3" marker-end="url(#fc1)"/>

    <rect x="70" y="162" width="440" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="1.3"/>
    <text x="90" y="187" fill="#111">2. rebase onto the latest release branch before opening a PR</text>

    <path d="M250,202 L250,226" stroke="#27803e" stroke-width="1.3" marker-end="url(#fc1)"/>

    <rect x="70" y="228" width="480" height="56" rx="4" fill="#fff" stroke="#333" stroke-width="1.3"/>
    <text x="90" y="249" fill="#111">3. squash messy commits:</text>
    <text x="90" y="267" fill="#8e44ad">git rebase -i {commit hash}</text>
    <text x="90" y="281" fill="#666" font-size="9">change "pick" to "s", rewrite the final message</text>

    <path d="M250,284 L250,308" stroke="#27803e" stroke-width="1.3" marker-end="url(#fc1)"/>

    <rect x="70" y="310" width="420" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="1.3"/>
    <text x="90" y="335" fill="#111">4. npm run format &amp;&amp; npm run lint</text>

    <path d="M250,350 L250,374" stroke="#27803e" stroke-width="1.3" marker-end="url(#fc1)"/>

    <rect x="70" y="376" width="420" height="56" rx="4" fill="#fff" stroke="#c0392b" stroke-width="1.3"/>
    <text x="90" y="397" fill="#111">5. push (usually gets rejected, history changed)</text>
    <text x="90" y="415" fill="#c0392b">git push -f</text>
    <text x="90" y="428" fill="#c0392b" font-size="9">(dangerous flag, use deliberately, not by habit)</text>

    <path d="M250,432 L250,456" stroke="#27803e" stroke-width="1.3" marker-end="url(#fc1)"/>

    <rect x="70" y="458" width="440" height="40" rx="4" fill="#fff" stroke="#333" stroke-width="1.3"/>
    <text x="90" y="483" fill="#111">6. code review with Marvin</text>
  </g>

  <text x="600" y="112" fill="#111" font-size="11" font-weight="bold">when things got tangled:</text>
  <rect x="600" y="126" width="340" height="110" rx="4" fill="#f7f7f7" stroke="#333" stroke-width="1.2"/>
  <text x="620" y="151" fill="#111" font-size="10">git reset --hard {commit hash}</text>
  <text x="620" y="171" fill="#111" font-size="10">git fetch</text>
  <text x="620" y="191" fill="#111" font-size="10">git pull</text>
  <text x="620" y="216" fill="#666" font-size="9">throws away local mess,</text>
  <text x="620" y="230" fill="#666" font-size="9">starts clean from origin</text>

  <text x="600" y="276" fill="#666" font-size="9.5" font-style="italic">didn't get this from a lecture, it came from</text>
  <text x="600" y="290" fill="#666" font-size="9.5" font-style="italic">breaking things and asking, more than once</text>

</svg>
