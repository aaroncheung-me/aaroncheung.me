<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fa1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1000" height="320" fill="#ffffff"/>
  <text x="30" y="34" fill="#111" font-size="16" font-weight="bold">Figure A: Clerk Session Token Flow</text>
  <line x1="30" y1="46" x2="970" y2="46" stroke="#ccc" stroke-width="1"/>
  <text x="30" y="66" fill="#666" font-size="10.5" font-style="italic">The mistake: treating "a token" as one universal thing</text>

  <rect x="40" y="110" width="180" height="60" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="130" y="135" text-anchor="middle" fill="#111" font-size="11.5">User signs in</text>
  <text x="130" y="151" text-anchor="middle" fill="#666" font-size="9.5">(Clerk, frontend)</text>

  <path d="M220,140 L270,140" stroke="#333" stroke-width="1.5" marker-end="url(#fa1)"/>

  <rect x="290" y="50" width="230" height="60" rx="4" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="405" y="75" text-anchor="middle" fill="#c0392b" font-size="11">getToken()</text>
  <text x="405" y="91" text-anchor="middle" fill="#888" font-size="9">default template</text>
  <text x="560" y="60" fill="#c0392b" font-size="10">wrong shape for Supabase RLS</text>

  <rect x="290" y="140" width="230" height="60" rx="4" fill="#fff" stroke="#27803e" stroke-width="1.5"/>
  <text x="405" y="162" text-anchor="middle" fill="#27803e" font-size="10.5">getToken({{</text>
  <text x="405" y="177" text-anchor="middle" fill="#27803e" font-size="10.5">template: 'supabase-local'</text>
  <text x="405" y="192" text-anchor="middle" fill="#27803e" font-size="10.5">}})</text>

  <path d="M405,110 L405,140" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="230" y="125" fill="#999" font-size="9" font-style="italic">(tried this first, failed)</text>

  <path d="M520,170 L570,170" stroke="#333" stroke-width="1.5" marker-end="url(#fa1)"/>

  <rect x="590" y="140" width="190" height="60" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="685" y="162" text-anchor="middle" fill="#111" font-size="11">Token attached to</text>
  <text x="685" y="178" text-anchor="middle" fill="#111" font-size="11">outgoing request</text>

  <path d="M780,170 L830,170" stroke="#333" stroke-width="1.5" marker-end="url(#fa1)"/>

  <rect x="840" y="110" width="130" height="120" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="905" y="140" text-anchor="middle" fill="#111" font-size="11">Express</text>
  <text x="905" y="156" text-anchor="middle" fill="#666" font-size="9">validates token</text>
  <line x1="860" y1="170" x2="950" y2="170" stroke="#ccc" stroke-width="1"/>
  <text x="905" y="190" text-anchor="middle" fill="#111" font-size="11">Supabase</text>
  <text x="905" y="206" text-anchor="middle" fill="#666" font-size="9">RLS check</text>

  <text x="500" y="270" text-anchor="middle" fill="#333" font-size="11">The lesson: a token isn't one thing, it's shaped by the template</text>
  <text x="500" y="288" text-anchor="middle" fill="#333" font-size="11">you request, based on what's going to read it downstream.</text>
</svg>
