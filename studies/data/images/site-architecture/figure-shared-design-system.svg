<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ax1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="30" y="34" fill="#111" font-size="16" font-weight="bold">Figure: One Design System, Four Properties</text>
  <line x1="30" y1="46" x2="970" y2="46" stroke="#ccc" stroke-width="1"/>
  <text x="30" y="66" fill="#666" font-size="10.5" font-style="italic">shared through a partials system and consistent localStorage keys, branching per-site only where it needs to</text>

  <!-- center: shared system -->
  <rect x="330" y="100" width="340" height="150" rx="6" fill="#f2f2ef" stroke="#111" stroke-width="1.6"/>
  <text x="500" y="128" text-anchor="middle" fill="#111" font-size="12.5" font-weight="bold">Shared Design System</text>
  <text x="500" y="150" text-anchor="middle" fill="#333" font-size="10">theme &amp; palette (localStorage)</text>
  <text x="500" y="168" text-anchor="middle" fill="#333" font-size="10">CRT effect, fonts, reduced motion</text>
  <text x="500" y="186" text-anchor="middle" fill="#333" font-size="10">footer chrome, partials loader</text>
  <text x="500" y="204" text-anchor="middle" fill="#333" font-size="10">(data-include + JSON content)</text>
  <text x="500" y="230" text-anchor="middle" fill="#888" font-size="9" font-style="italic">zero dependencies, hand-built</text>

  <!-- four property boxes -->
  <rect x="60" y="330" width="190" height="110" rx="4" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <text x="155" y="358" text-anchor="middle" fill="#111" font-size="11.5" font-weight="bold">Main Portfolio</text>
  <text x="155" y="378" text-anchor="middle" fill="#666" font-size="9.5">JSON-driven nav tree,</text>
  <text x="155" y="392" text-anchor="middle" fill="#666" font-size="9.5">live demo tiles,</text>
  <text x="155" y="406" text-anchor="middle" fill="#666" font-size="9.5">coding-project growth</text>

  <rect x="280" y="330" width="190" height="110" rx="4" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <text x="375" y="358" text-anchor="middle" fill="#111" font-size="11.5" font-weight="bold">Art (/art/)</text>
  <text x="375" y="378" text-anchor="middle" fill="#666" font-size="9.5">own palette + font</text>
  <text x="375" y="392" text-anchor="middle" fill="#666" font-size="9.5">namespace, branches</text>
  <text x="375" y="406" text-anchor="middle" fill="#666" font-size="9.5">off the shared system</text>

  <rect x="500" y="330" width="190" height="110" rx="4" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <text x="595" y="358" text-anchor="middle" fill="#111" font-size="11.5" font-weight="bold">Sound (/sound/)</text>
  <text x="595" y="378" text-anchor="middle" fill="#666" font-size="9.5">editorial layout,</text>
  <text x="595" y="392" text-anchor="middle" fill="#666" font-size="9.5">still shares theme</text>
  <text x="595" y="406" text-anchor="middle" fill="#666" font-size="9.5">persistence + fonts</text>

  <rect x="720" y="330" width="200" height="110" rx="4" fill="#fff" stroke="#333" stroke-width="1.4"/>
  <text x="820" y="358" text-anchor="middle" fill="#111" font-size="11.5" font-weight="bold">Studies (/studies/)</text>
  <text x="820" y="378" text-anchor="middle" fill="#666" font-size="9.5">self-contained frozen</text>
  <text x="820" y="392" text-anchor="middle" fill="#666" font-size="9.5">copies of shared assets,</text>
  <text x="820" y="406" text-anchor="middle" fill="#666" font-size="9.5">deployable standalone</text>

  <!-- connecting lines -->
  <path d="M420,250 L155,330" stroke="#333" stroke-width="1.3" fill="none" marker-end="url(#ax1)"/>
  <path d="M460,250 L375,330" stroke="#333" stroke-width="1.3" fill="none" marker-end="url(#ax1)"/>
  <path d="M540,250 L595,330" stroke="#333" stroke-width="1.3" fill="none" marker-end="url(#ax1)"/>
  <path d="M580,250 L820,330" stroke="#333" stroke-width="1.3" fill="none" marker-end="url(#ax1)"/>

  <!-- the two directions annotation -->
  <path d="M155,332 L155,300" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="155" y="290" text-anchor="middle" fill="#c0392b" font-size="9.5" font-weight="bold">direction 1: coding</text>

  <path d="M600,332 L780,300" stroke="#2980b9" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="780" y="290" text-anchor="middle" fill="#2980b9" font-size="9.5" font-weight="bold">direction 2: UI/UX &amp; frontend</text>

  <text x="500" y="500" text-anchor="middle" fill="#333" font-size="11">Redesigned to grow in two directions at once: more coding projects inside the main portfolio,</text>
  <text x="500" y="518" text-anchor="middle" fill="#333" font-size="11">and more standalone mini-sites alongside it, without either direction crowding the other out.</text>

</svg>
